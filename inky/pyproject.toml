[project]
name = "mvg-departures-inky"
version = "0.0.1"
description = "MVG departures display for Pimoroni Inky e-ink displays"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MPL-2.0"}
authors = [
    {name = "Dmitry Ledentsov"}
]
keywords = ["mvg", "public-transport", "munich", "departures", "inky", "e-ink", "pimoroni"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Parent project must be installed separately: pip install -e ..
    # Then install this with: pip install -e .
    "pillow>=10.0.0",
    "pydantic-settings>=2.6.0",
    "aiohttp>=3.13.3",
    "cairosvg>=2.7.0",  # For SVG to PNG conversion (primary)
    "font-fredoka-one>=0.0.4",  # Font option (configurable, also used in main project)
    # HK Grotesk fonts must be downloaded manually to inky/fonts/ directory
    # See inky/fonts/README.md for download instructions
    "hitherdither @ git+https://github.com/hbldh/hitherdither.git",  # For dithering images to 7-color palette (Pimoroni example)
]

[project.optional-dependencies]
# Hardware dependencies (Linux/Raspberry Pi only)
# These require Linux kernel headers and won't build on macOS/Windows
# Install with: pip install -e ".[hardware]"
hardware = [
    "inky>=1.4.0",
]
# SVG fallback libraries (for when cairosvg fails, e.g., missing Cairo library on macOS)
# These are installed in CI to ensure tests pass even when cairosvg fails
svg-fallback = [
    "svglib>=1.5.0",  # Fallback for SVG conversion when Cairo library is unavailable
    "reportlab>=4.0.0",  # Required by svglib for SVG rendering
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=25.12.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "svglib>=1.5.0",  # Fallback for SVG conversion when Cairo library is unavailable (for CI)
    "reportlab>=4.0.0",  # Required by svglib for SVG rendering (for CI)
]

[project.scripts]
mvg-departures-inky = "mvg_departures_inky.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mvg_departures_inky"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "SIM", "ARG", "PIE", "PT", "RET", "TCH", "TID", "Q", "RUF"]
ignore = ["E501"]  # Line length handled by Black

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "inky.*",
    "PIL.*",
    "hitherdither.*",
    "cairosvg.*",
    "font_fredoka_one.*",
    "svglib.*",
    "reportlab.*",
    "tomli.*",
]
ignore_missing_imports = true
ignore_errors = true