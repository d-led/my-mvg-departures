# Test configuration for UI testing with mock data
# This config uses the 'test' API provider which returns static mock data
# with various scenarios: canceled departures, delays, real-time, planned-only, etc.

[display]
title = "Test Departures Dashboard"
theme = "light"
departures_per_page = 5
page_rotation_seconds = 8
time_format_toggle_seconds = 5
pagination_enabled = false
fill_vertical_space = false
random_header_colors = false
refresh_interval_seconds = 20
banner_color = "#087BC4"

font_size_route_number = "4rem"
font_size_destination = "3.5rem"
font_size_platform = "2.5rem"
font_size_time = "4rem"
font_size_stop_header = "3rem"
font_size_direction_header = "2.5rem"
font_size_pagination_indicator = "2rem"
font_size_countdown_text = "1.8rem"
font_size_delay_amount = "2rem"
font_size_no_departures = "2.5rem"
font_size_status_header = "1.875rem"

[api]
api_provider = "test"
sleep_ms_between_calls = 0

# Test stop with various departure scenarios
[[stops]]
station_id = "test:station:001"
station_name = "Test Station"
api_provider = "test"
max_departures_per_stop = 10
max_departures_per_route = 3
departure_leeway_minutes = 0
show_ungrouped = true
ungrouped_title = "All Departures"
