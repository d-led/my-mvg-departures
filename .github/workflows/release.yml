name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  wait-for-workflows:
    name: Wait for CI and Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.ref }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          running-workflow-name: "Wait for CI and Docker Build"
          check-name: "Test Python 3.13 on ubuntu-latest"

      - name: Wait for Docker build
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.ref }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          running-workflow-name: "Wait for CI and Docker Build"
          check-name: "Build and Push Docker Image"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wait-for-workflows
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: "See [CHANGELOG.md](CHANGELOG.md)"
          generate_release_notes: false
