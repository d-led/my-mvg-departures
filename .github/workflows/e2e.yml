name: E2E Pipeline

# The application under test is the published image (ghcr.io/<repo>:main). On a
# pull request that is still main's image, not the PR's code, so a green PR run
# said nothing about the PR. The pipeline therefore runs after the main build
# and on demand only; a PR is covered by ci.yml and the build-only docker job.
on:
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Set to true to deploy to GitHub Pages after E2E"
        required: false
        default: "false"
      docker_image:
        description: "Docker image to use for the app service (default: ghcr.io image)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  checks: write
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
    container:
      image: cypress/included:latest
      options: --ipc=host
    services:
      app:
        image: ${{ inputs.docker_image != '' && inputs.docker_image || format('ghcr.io/{0}:main', github.repository) }}
        ports:
          - 8000:8000
        env:
          HOST: "0.0.0.0"
          PORT: "8000"
          CONFIG_FILE: /app/config.example.toml
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run && github.event.workflow_run.head_sha || github.ref }}
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache npm packages and Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            # The image sets CYPRESS_CACHE_FOLDER=/root/.cache/Cypress while HOME
            # is /github/home, so "~" pointed at a folder Cypress never reads.
            /root/.cache/Cypress
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --progress=false
      # A restored node_modules makes npm print "up to date" without running
      # cypress's postinstall, and the binary it looked for was not cached.
      - name: Make sure the Cypress binary is there
        run: npx cypress install
      - name: Wait for service
        run: |
          n=0
          until node -e "require('http').get('http://app:8000/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"; do
            n=$((n+1))
            [ $n -ge 60 ] && exit 1
            sleep 1
          done
      - name: Run E2E tests (with JUnit reporter)
        run: |
          mkdir -p test-results
          npx cypress run --e2e --browser electron --config-file cypress.config.ts --config baseUrl=http://app:8000 --spec 'cypress/e2e/!(screenshot).cy.js' --reporter mocha-junit-reporter --reporter-options mochaFile=test-results/junit-[hash].xml
        env:
          CYPRESS_CI: true
          NODE_OPTIONS: --dns-result-order=ipv4first
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results
      - name: Publish JUnit to GitHub Checks
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }} # run this step even if previous step failed
        with:
          name: Test reports
          path: test-results/*.xml
          reporter: java-junit
