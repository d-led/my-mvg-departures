name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install macOS system dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install cairo librsvg pkg-config
          # Verify pkg-config can find Cairo (cairocffi uses this)
          pkg-config --modversion cairo || exit 1
          # Set PKG_CONFIG_PATH explicitly (though Homebrew paths are usually in default search)
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV
          # Verify library exists
          ls -la $(brew --prefix)/lib/libcairo*.dylib || exit 1

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          # Cache key includes OS to separate macOS and Linux caches
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'inky/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Setup main project
        run: |
          ./scripts/setup.sh

      - name: Setup inky subproject (dev mode, no hardware)
        run: |
          ./inky/scripts/setup_dev.sh

      - name: Verify cairosvg installation (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          source .venv/bin/activate || true
          # Test import
          python -c "import cairosvg; print('✓ cairosvg imported successfully')" || {
            echo "❌ cairosvg import failed, checking cairocffi..."
            python -c "import cairocffi; print('cairocffi imported')" || {
              echo "❌ cairocffi also failed, attempting to reinstall..."
              pip uninstall -y cairosvg cairocffi pycairo || true
              pip install --no-cache-dir --force-reinstall cairosvg
              python -c "import cairosvg; print('✓ cairosvg imported successfully after reinstall')"
            }
          }

      - name: Run all checks (formatting, linting, type checking, tests)
        run: |
          ./scripts/test.sh

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install build dependencies
        run: |
          uv pip install build

      - name: Build package
        run: |
          uv run python -m build

      - name: Check built package
        run: |
          uv pip install dist/*.whl
