name: SPA CI

# The Python workflow (ci.yml) ignores spa/**, and this workflow only looks at
# spa/**, so an SPA-only pull request still gets checked before it is merged.
on:
  push:
    branches: [main]
    paths:
      - "spa/**"
      - ".github/workflows/spa-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "spa/**"
      - ".github/workflows/spa-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write # the e2e job publishes its JUnit report to the checks tab

jobs:
  spa:
    name: SPA checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: spa/package-lock.json

      - name: Install SPA dependencies
        working-directory: spa
        run: npm ci

      - name: Type check
        working-directory: spa
        run: npm run typecheck

      - name: Svelte check
        working-directory: spa
        run: npm run check

      - name: Lint
        working-directory: spa
        run: npm run lint

      - name: Check formatting
        working-directory: spa
        run: npm run prettier:check

      - name: Unit tests
        working-directory: spa
        run: npm test

  spa-e2e:
    name: SPA e2e
    needs: spa
    runs-on: ubuntu-latest
    container:
      # Comes with Cypress and its browsers preinstalled, so only the npm
      # packages and the Cypress binary cache need to be fetched.
      image: cypress/included:latest
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache npm packages and Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            # The image sets CYPRESS_CACHE_FOLDER=/root/.cache/Cypress while HOME
            # is /github/home, so "~" pointed at a folder Cypress never reads.
            /root/.cache/Cypress
            node_modules
            spa/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'spa/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --progress=false

      - name: Install SPA dependencies
        working-directory: spa
        run: npm install --prefer-offline --no-audit --progress=false

      # A restored node_modules makes npm print "up to date" without running
      # cypress's postinstall, and the binary it looked for was not cached.
      - name: Make sure the Cypress binary is there
        working-directory: spa
        run: npx cypress install

      - name: Start the SPA
        working-directory: spa
        run: npm run dev > /tmp/spa-server.log 2>&1 &

      - name: Wait for the SPA
        run: |
          n=0
          until node -e "require('http').get('http://localhost:8000/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"; do
            n=$((n+1))
            [ $n -ge 60 ] && cat /tmp/spa-server.log && exit 1
            sleep 1
          done

      - name: Run E2E tests (with JUnit reporter)
        run: |
          mkdir -p test-results
          npx cypress run --e2e --browser chrome --config baseUrl=http://localhost:8000 --spec 'cypress/e2e/spa/**/*.cy.js' --reporter mocha-junit-reporter --reporter-options mochaFile=test-results/junit-[hash].xml
        env:
          CYPRESS_CI: true
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-e2e-results
          path: test-results

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-e2e-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-e2e-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Publish JUnit to GitHub Checks
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }} # run this step even if previous step failed
        with:
          name: SPA e2e reports
          path: test-results/*.xml
          reporter: java-junit
