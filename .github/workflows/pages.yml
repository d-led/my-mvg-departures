name: Deploy SPA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "spa/**"
      - "config.example.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: spa/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('spa/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install SPA dependencies
        working-directory: spa
        run: |
          npm ci

      - name: Run SPA tests
        working-directory: spa
        run: |
          ./scripts/test.sh

      - name: Build SPA
        working-directory: spa
        run: |
          npm run build

      - name: Verify config.example.toml is present
        working-directory: spa
        run: |
          if [ ! -f "dist/config.example.toml" ]; then
            echo "ERROR: config.example.toml not found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "✓ config.example.toml found in dist/"
          ls -lh dist/config.example.toml

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "spa/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
