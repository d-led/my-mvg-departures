name: Deploy SPA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "spa/**"
      - "config.example.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (with caching)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: spa/package-lock.json

      - name: Install SPA dependencies
        working-directory: spa
        run: |
          npm ci

      - name: Run SPA tests
        working-directory: spa
        run: |
          ./scripts/test.sh

      - name: Build SPA
        working-directory: spa
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm run build
          SHORT_SHA="${GITHUB_SHA:0:7}"
          sed -i "s|__BUILD_SHA__|$SHORT_SHA|g" dist/bundle.js
          sed -i '/__BUILD_SHA_HIDE_START__/,/__BUILD_SHA_HIDE_END__/d' dist/css/departures.css

      - name: Verify config.example.toml is present
        working-directory: spa
        run: |
          if [ ! -f "dist/config.example.toml" ]; then
            echo "ERROR: config.example.toml not found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "✓ config.example.toml found in dist/"
          ls -lh dist/config.example.toml

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "spa/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
